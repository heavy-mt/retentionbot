name: Tests
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      rabbitmq:
        image: rabbitmq:4.3.6-management
        env:
          RABBITMQ_DEFAULT_USER: test
          RABBITMQ_DEFAULT_PASS: disposable-test-password
        ports: [5672:5672]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: python -m venv .synapse-env && .synapse-env/bin/pip install matrix-synapse==1.161.0
      - run: ruff check src tests
      - run: pytest -q
        env:
          SYNAPSE_PYTHON: .synapse-env/bin/python
          RABBITMQ_TEST_URL: amqp://test:disposable-test-password@localhost:5672/
      - run: docker build -t retentionbot:test .
