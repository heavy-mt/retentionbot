name: Tests
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: disposable-test-password
          POSTGRES_DB: retentiontest
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U test -d retentiontest"
          --health-interval 5s --health-timeout 5s --health-retries 12
      rabbitmq:
        image: rabbitmq:4.3.6-management
        env:
          RABBITMQ_DEFAULT_USER: test
          RABBITMQ_DEFAULT_PASS: disposable-test-password
        ports: [5672:5672]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: python -m venv .synapse-env && .synapse-env/bin/pip install matrix-synapse==1.162.0 && .synapse-env/bin/pip install --no-deps -e .
      - run: .synapse-env/bin/python deploy/patch-synapse-room-limiter.py
      - run: ruff check src tests deploy/patch-synapse-room-limiter.py
      - run: pytest -q
        env:
          SYNAPSE_PYTHON: .synapse-env/bin/python
          RABBITMQ_TEST_URL: amqp://test:disposable-test-password@localhost:5672/
          TEST_DATABASE_URL: postgresql://test:disposable-test-password@localhost:5432/retentiontest
      - run: docker build -t retentionbot:0.3.0 .
      - run: docker build -f deploy/Dockerfile.synapse -t retention-synapse:1.162.0 .
      - name: Verify room limiter in the actual Synapse 1.162.0 image
        run: |
          docker run --rm --network none --entrypoint python \
            -e RETENTION_VERIFY_INSTALLED_SYNAPSE=1 \
            -e RETENTION_ROOM_LIMITER_PATCH=/tmp/patch-synapse-room-limiter.py \
            -v "$PWD/tests/test_synapse_room_limiter.py:/tmp/test_synapse_room_limiter.py:ro" \
            -v "$PWD/deploy/patch-synapse-room-limiter.py:/tmp/patch-synapse-room-limiter.py:ro" \
            retention-synapse:1.162.0 /tmp/test_synapse_room_limiter.py -v
      - run: docker build -f deploy/Dockerfile.command-bot -t retention-command-bot:0.3.0 .
      - run: bash .github/smoke-compose.sh

