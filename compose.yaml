x-service: &service
  build: .
  image: retentionbot:0.3.0
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  environment:
    SYNAPSE_URL: ${SYNAPSE_URL:?Set SYNAPSE_URL}
    SYNAPSE_MODULE_SECRET_FILE: /run/secrets/synapse_module_secret
    DATABASE_URL: postgresql://retention:${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}@postgres:5432/retentionbot
    RABBITMQ_URL: amqp://retention:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}@rabbitmq:5672/retention
    POLL_SECONDS: ${POLL_SECONDS:-1}
    REFRESH_SECONDS: ${REFRESH_SECONDS:-60}
    BATCH_SIZE: ${BATCH_SIZE:-1000}
  volumes: [service-data:/data]
  secrets: [synapse_module_secret]
  networks: [synapse, broker, state]
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy

services:
  command-bot:
    profiles: [commands]
    build:
      context: .
      dockerfile: deploy/Dockerfile.command-bot
    image: retention-command-bot:0.3.0
    command: [command-bot]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      SYNAPSE_URL: ${SYNAPSE_URL}
      COMMAND_BOT_USER_ID: ${COMMAND_BOT_USER_ID:-}
      COMMAND_BOT_ACCESS_TOKEN_FILE: /run/secrets/command_bot_access_token
    secrets: [command_bot_access_token]
    volumes: [command-bot-data:/data]
    networks: [synapse]
    healthcheck:
      test: [CMD, retentionbot, bot-health]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
  observer:
    <<: *service
    command: [observer]
    healthcheck:
      test: [CMD, retentionbot, health]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3
  worker:
    <<: *service
    command: [worker]
  rabbitmq:
    image: rabbitmq:4.3.6
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: retention
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: retention
    volumes: [rabbitmq-data:/var/lib/rabbitmq]
    networks: [broker]
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 15s
      timeout: 10s
      retries: 10
  postgres:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: retentionbot
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
    secrets: [postgres_admin_password]
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./deploy/postgres-init.sh:/docker-entrypoint-initdb.d/10-retentionbot.sh:ro
    networks: [state]
    healthcheck:
      test: [CMD-SHELL, pg_isready -h 127.0.0.1 -U postgres -d retentionbot]
      interval: 10s
      timeout: 5s
      retries: 10

secrets:
  command_bot_access_token:
    file: ./secrets/command_bot_access_token
  synapse_module_secret:
    file: ./secrets/synapse_module_secret
  postgres_admin_password:
    file: ./secrets/postgres_admin_password

volumes:
  command-bot-data:
  service-data:
  rabbitmq-data:
  postgres-data:
networks:
  synapse:
    external: true
    name: ${SYNAPSE_NETWORK:-matrix_net}
  broker:
    internal: true
  state:
    internal: true
