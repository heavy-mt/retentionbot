x-bot: &bot
  build: .
  image: retentionbot:0.1.0
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  environment: &bot-env
    MATRIX_HOMESERVER: ${MATRIX_HOMESERVER:?Set MATRIX_HOMESERVER}
    MATRIX_SERVER_NAME: ${MATRIX_SERVER_NAME:?Set MATRIX_SERVER_NAME}
    BOT_USER_ID: ${BOT_USER_ID:?Set BOT_USER_ID}
    BOT_ACCESS_TOKEN_FILE: /run/secrets/bot_access_token
    BOT_DEVICE_ID_FILE: /run/secrets/bot_device_id
    GATEWAY_SECRET_FILE: /run/secrets/gateway_secret
    CRYPTO_STORE_KEY_FILE: /run/secrets/crypto_store_key
    GATEWAY_URL: http://admin-gateway:8080
    DATABASE_URL: postgresql://retention:${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}@postgres:5432/retentionbot
    RABBITMQ_URL: amqp://retention:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}@rabbitmq:5672/retention
    DEVICE_TRUST: ${DEVICE_TRUST:-tofu}
    POLL_SECONDS: ${POLL_SECONDS:-1}
    DISCOVER_SECONDS: ${DISCOVER_SECONDS:-60}
    REDACTION_LEAD_SECONDS: ${REDACTION_LEAD_SECONDS:-300}
    MEDIA_GRACE_SECONDS: ${MEDIA_GRACE_SECONDS:-60}
    ROOM_ADMIN_POWER_LEVEL: ${ROOM_ADMIN_POWER_LEVEL:-100}
  volumes: [bot-data:/data]
  secrets: [bot_access_token, bot_device_id, gateway_secret, crypto_store_key]
  networks: [outbound, broker, state]
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    admin-gateway:
      condition: service_healthy

services:
  observer:
    <<: *bot
    command: [observer]
    healthcheck:
      test: [CMD, retentionbot, health]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3
  worker:
    <<: *bot
    command: [worker]
    secrets: [bot_access_token, gateway_secret]
  admin-gateway:
    build: .
    image: retentionbot:0.1.0
    command: [gateway]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      MATRIX_HOMESERVER: ${MATRIX_HOMESERVER}
      MATRIX_SERVER_NAME: ${MATRIX_SERVER_NAME}
      BOT_USER_ID: ${BOT_USER_ID}
      GATEWAY_SECRET_FILE: /run/secrets/gateway_secret
      SYNAPSE_ADMIN_TOKEN_FILE: /run/secrets/synapse_admin_token
      SYNAPSE_RETENTION_CONFIG_FILE: /etc/retentionbot/synapse.yaml
      DATABASE_URL: postgresql://retention:${DATABASE_PASSWORD}@postgres:5432/retentionbot
      RABBITMQ_URL: amqp://unused
    volumes:
      - ${SYNAPSE_RETENTION_CONFIG_PATH:?Set SYNAPSE_RETENTION_CONFIG_PATH}:/etc/retentionbot/synapse.yaml:ro
    secrets: [gateway_secret, synapse_admin_token]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    networks: [outbound, state]
    depends_on:
      postgres:
        condition: service_healthy
  rabbitmq:
    image: rabbitmq:4.3.6
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: retention
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: retention
    volumes: [rabbitmq-data:/var/lib/rabbitmq]
    networks: [broker]
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 15s
      timeout: 10s
      retries: 10
  postgres:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: retentionbot
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
    secrets: [postgres_admin_password]
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./deploy/postgres-init.sh:/docker-entrypoint-initdb.d/10-retentionbot.sh:ro
    networks: [state]
    healthcheck:
      test: [CMD-SHELL, pg_isready -h 127.0.0.1 -U postgres -d retentionbot]
      interval: 10s
      timeout: 5s
      retries: 10

secrets:
  bot_access_token:
    file: ./secrets/bot_access_token
  bot_device_id:
    file: ./secrets/bot_device_id
  gateway_secret:
    file: ./secrets/gateway_secret
  crypto_store_key:
    file: ./secrets/crypto_store_key
  synapse_admin_token:
    file: ./secrets/synapse_admin_token
  postgres_admin_password:
    file: ./secrets/postgres_admin_password

volumes:
  bot-data:
  rabbitmq-data:
  postgres-data:
networks:
  outbound:
  broker:
    internal: true
  state:
    internal: true
