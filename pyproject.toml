[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "matrix-retentionbot"
version = "0.1.0"
description = "Room-controlled Matrix message expiry and local attachment cleanup"
requires-python = ">=3.12"
dependencies = ["matrix-nio[e2e]==0.26.0", "aiohttp>=3.12,<4", "aio-pika>=9.5,<10", "psycopg[binary]>=3.2,<4", "PyYAML>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=1,<2", "ruff>=0.9,<1", "PyYAML>=6,<7"]

[project.scripts]
retentionbot = "retentionbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires a local Synapse test server"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["ASYNC240"]

[tool.ruff.lint.per-file-ignores]
"tests/test_integration.py" = ["ASYNC220", "ASYNC221"]
